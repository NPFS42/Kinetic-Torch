name: Kinetic Torch dual-distribution validation
on:
  push:
    branches: [main, feature/motorola-defaults-reset-20261103]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Use CI JDK and install Android build dependencies
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test both flavors and assemble distribution artifacts
        run: >-
          gradle --no-daemon
          :app:testPlayDebugUnitTest
          :app:testFdroidDebugUnitTest
          :app:assemblePlayDebug
          :app:assembleFdroidDebug
          :app:bundlePlayRelease
          :app:bundlePlayDiagnostic
          :app:assemblePlayDiagnostic
          :app:assembleFdroidRelease
      - name: Verify both debug signatures and distribution package identities
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/play/debug/app-play-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          bash tools/verify-distribution-apks.sh "$ANDROID_HOME/build-tools/36.0.0/aapt"
          sha256sum app/build/outputs/apk/play/debug/app-play-debug.apk
          sha256sum app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          sha256sum app/build/outputs/bundle/playDiagnostic/app-play-diagnostic.aab
          sha256sum app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-play-debug-APK
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload separately installable F-Droid debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-fdroid-debug-APK-FOR-DEVICE-TESTING
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsigned Play artifacts (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-play-UNSIGNED-DO-NOT-PUBLISH
          path: |
            app/build/outputs/apk/play/diagnostic/*.apk
            app/build/outputs/bundle/playDiagnostic/*.aab
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned F-Droid candidate (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-fdroid-UNSIGNED-DO-NOT-PUBLISH
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-dual-flavor-unit-test-results
          path: |
            app/build/test-results/testPlayDebugUnitTest/
            app/build/reports/tests/testPlayDebugUnitTest/
            app/build/test-results/testFdroidDebugUnitTest/
            app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3
