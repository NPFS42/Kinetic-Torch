name: Kinetic Torch 1.3.4 source validation
on:
  push:
    branches: [main, feature/motorola-defaults-reset-20261103]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Use CI JDK and install Android build dependencies
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and assemble diagnostic APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleDiagnostic :app:assembleDiagnostic
      - name: Verify debug APK signature and record checksums
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/bundle/diagnostic/app-diagnostic.aab
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-1.3.4-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish unsigned Play diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-play-diagnostic-UNSIGNED
          path: |
            app/build/outputs/apk/diagnostic/*.apk
            app/build/outputs/bundle/diagnostic/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-torch-1.3.4-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
